[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "implicit_filter"
version = "1.3.1"

description = "Python package implementing implicit filtering method on any type of mesh."
readme = "readme.md"
authors = [{ name = "Kacper Nowak", email = "kacper.nowak@awi.de" },
           { name = "Aaron Wienkers", email = "awienkers@ethz.ch" },
           { name = "Willi Rath", email = "wrath@geomar.de" }]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License"
]

requires-python = ">=3.10"

dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
cpu = [
    "jax[cpu]"
]
cuda12 = [
    "jax[cuda12]"
]
# AMD GPUs through JAX's ROCm plugin, which targets ROCm 6.x; a matching ROCm
# installation has to be present on the machine already.
rocm = [
    "jax[rocm]"
]
tpu = [
    "jax[tpu]"
]
# Apple Silicon GPUs are served by Apple's PJRT plugin, not by a jax extra:
# "jax[apple]" does not exist -- pip only warns about the unknown extra and
# installs plain jax, i.e. a CPU-only build.
apple = [
    "jax-metal"
]
# Required only by NemoFilter(neighb='full'), which uses a least-squares fit to
# resolve the north-fold row correspondence. pandas is a base requirement, so
# this extra is a documented alias rather than an additional install.
nemo = [
    "pandas"
]
# Required only by set_preconditioner("vcycle"): pyamg builds the multigrid
# hierarchy at setup time; the apply phase is pure JAX.
vcycle = [
    "pyamg",
    "scipy"
]
test = [
    "pytest",
    "scipy",
    "pandas",
    "pyamg"
]


[project.urls]
Homepage = "https://github.com/FESOM/implicit_filter"

[tool.setuptools]
platforms = ["any"]
zip-safe  = false
include-package-data = true


