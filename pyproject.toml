[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "implicit_filter"
version = "1.3.1"

description = "Python package implementing implicit filtering method on any type of mesh."
readme = "readme.md"
authors = [{ name = "Kacper Nowak", email = "kacper.nowak@awi.de" },
           { name = "Aaron Wienkers", email = "awienkers@ethz.ch" },
           { name = "Willi Rath", email = "wrath@geomar.de" }]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License"
]

requires-python = ">=3.10"

dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
cpu = [
    "jax[cpu]"
]
cuda11 = [
    "jax[cuda11_pip]"
]
cuda12 = [
    "jax[cuda12]"
]
apple = [
    "jax[apple]"
]
# Required only by NemoFilter(neighb='full'), which uses a linear fit to
# resolve the north-fold row correspondence.
nemo = [
    "pandas",
    "scikit-learn"
]
# Required only by set_preconditioner("vcycle"): pyamg builds the multigrid
# hierarchy at setup time; the apply phase is pure JAX.
vcycle = [
    "pyamg",
    "scipy"
]
test = [
    "pytest",
    "scipy",
    "pandas",
    "scikit-learn",
    "pyamg"
]


[project.urls]
Homepage = "https://github.com/FESOM/implicit_filter"

[tool.setuptools]
platforms = ["any"]
zip-safe  = false
include-package-data = true


